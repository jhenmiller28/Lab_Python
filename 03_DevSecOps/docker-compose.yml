version: '3.8'
services:
  centinela-pro:
    build: .
    container_name: centinela-2.0
    restart: always  # Si el contenedor falla, Docker lo levanta solo
    environment:
      - PYTHONUNBUFFERED=1 # Logs en tiempo real garantizados
    volumes:
      - /var/log/auth.log:/var/log/auth.log:ro # Acceso a logs en solo lectura

# ----NUEVO TRABAJADOR AUDITOR.PY
  auditor-login:
    build: .
    container_name: auditor-accesos
    command: python auditor.py
    restart: always
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - /var/log/auth.log:/var/log/auth.log:ro

