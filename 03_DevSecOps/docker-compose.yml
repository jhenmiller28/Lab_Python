version: '3.8'
services:
  centinela-pro:
    build: .
    container_name: centinela-3.0
    command: python centinela_3.0.py # la clave esta aca
    restart: always  # Si el contenedor falla, Docker lo levanta solo

    cap_add: #comoando de añadir csapacidades al conteneodor
      - NET_ADMIN #administracion de red, le permite acceder al la iptables para poder bloquear ips
    network_mode: "host" # nos permite usar la ip dep servidor,normalmente cada contenedor es una burbuja y cuenta con su propa ip

    environment:
      - PYTHONUNBUFFERED=1 # Logs en tiempo real garantizados
    volumes:
      - /var/log/auth.log:/var/log/auth.log:ro # Acceso a logs en solo lectura

# ----NUEVO TRABAJADOR AUDITOR.PY
  auditor-login:
    build: .
    container_name: auditor-accesos
    command: python auditor.py
    restart: always
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - /var/log/auth.log:/var/log/auth.log:ro

